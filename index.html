<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Permanent Interior · DERICK AFTERPARTY</title>
<style>
:root { --bg: #0a0a0c; --fg: #e8e6e3; --accent: #c8b8a0; --muted: #6a6560; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: none; }
#app { height: 100%; display: flex; flex-direction: column; }
header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); z-index: 10; background: rgba(10,10,12,0.9); }
header h1 { font-size: 13px; font-weight: 500; color: var(--fg); }
nav { display: flex; gap: 8px; }
nav button { background: transparent; border: 1px solid #333; color: var(--fg); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
nav button.active { background: var(--accent); color: #111; border-color: var(--accent); }
#canvas-container { flex: 1; position: relative; }
canvas { display: block; width: 100%; height: 100%; }
.track-label { position: absolute; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg); pointer-events: none; white-space: nowrap; mix-blend-mode: difference; }
.hint { position: absolute; bottom: 16px; left: 16px; right: 16px; text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Permanent Interior</h1>
    <nav>
      <button data-exp="1" class="active">Residue</button>
      <button data-exp="2">Overlap</button>
      <button data-exp="3">Recall</button>
    </nav>
  </header>
  <div id="canvas-container">
    <canvas id="c"></canvas>
    <div id="overlay" style="position:absolute;inset:0;pointer-events:none"></div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<script>
const tracks = [
  {artist: "Mazzy Star", title: "Halah"},
  {artist: "Fiona Apple", title: "Paper Bag"},
  {artist: "Leonard Cohen", title: "The Smokey Life"},
  {artist: "Sneaker Pimps", title: "Small Town Witch"},
  {artist: "Gorillaz", title: "5/4"},
  {artist: "Donovan", title: "Hurdy Gurdy Man"},
  {artist: "Patti Smith", title: "Dancing Barefoot"},
  {artist: "The Smiths", title: "Please Please Please Let Me Get What I Want"},
  {artist: "Air", title: "Playground Love"},
  {artist: "Red Hot Chili Peppers", title: "Breaking the Girl"}
];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hint = document.getElementById('hint');
let exp = 1, particles = [], shapes = [], recalls = [], lastTouch = {x:0,y:0,active:false}, pointers = new Map(), frame = 0;
let reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){ const dpr=Math.min(devicePixelRatio||1,2); canvas.width=canvas.clientWidth*dpr; canvas.height=canvas.clientHeight*dpr; ctx.scale(dpr,dpr); }
addEventListener('resize',resize); resize();
function switchExp(n){ exp=n; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.exp==n)); particles=[]; shapes=[]; recalls=[]; overlay.innerHTML=''; hint.textContent = n===1?'Drag or touch to leave residue. Approach old marks to reawaken them.':n===2?'Pull shapes together. Overlaps create temporary intersections.':'Hold or circle to summon. Released forms return altered.'; }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchExp(+b.dataset.exp)); switchExp(1);
canvas.addEventListener('pointerdown',e=>{ e.preventDefault(); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY-48}); lastTouch={x:e.clientX,y:e.clientY-48,active:true}; });
canvas.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId))return; const p=pointers.get(e.pointerId); p.x=e.clientX; p.y=e.clientY-48; lastTouch={x:p.x,y:p.y,active:true}; });
canvas.addEventListener('pointerup',e=>{ pointers.delete(e.pointerId); if(!pointers.size) lastTouch.active=false; });
canvas.addEventListener('pointercancel',e=>pointers.delete(e.pointerId));
addEventListener('keydown',e=>{ if(e.key==='1')switchExp(1); if(e.key==='2')switchExp(2); if(e.key==='3')switchExp(3); if(e.key===' '){ e.preventDefault(); lastTouch={x:canvas.clientWidth/2,y:canvas.clientHeight/2,active:true}; setTimeout(()=>lastTouch.active=false,200); } });
function getRandomTrack(){ return tracks[Math.floor(Math.random()*tracks.length)]; }
function updateResidue(){ if(lastTouch.active && Math.random()<0.6){ particles.push({x:lastTouch.x+(Math.random()-0.5)*20,y:lastTouch.y+(Math.random()-0.5)*20,life:1,size:2+Math.random()*6,track:getRandomTrack(),reawakened:0,hue:Math.random()*40+20}); } for(let p of particles){ const d=Math.hypot(p.x-lastTouch.x,p.y-lastTouch.y); if(lastTouch.active && d<80 && p.life<0.4){ p.reawakened=Math.min(1,p.reawakened+0.05); p.life=Math.min(1,p.life+0.08); } p.life-=reduced?0.002:0.004; p.y+=Math.sin(frame*0.01+p.x)*0.2; } particles=particles.filter(p=>p.life>0||p.reawakened>0.1); }
function drawResidue(){ ctx.fillStyle='rgba(10,10,12,0.15)'; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight); for(let p of particles){ const a=Math.max(0.05,p.life*0.7+p.reawakened*0.5); ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.6+p.reawakened),0,Math.PI*2); ctx.fillStyle=`hsla(${p.hue},30%,${60+p.reawakened*20}%,${a})`; ctx.fill(); if(p.reawakened>0.3 && Math.random()<0.02){ const l=document.createElement('div'); l.className='track-label'; l.textContent=p.track.artist; l.style.left=(p.x-40)+'px'; l.style.top=(p.y-20)+'px'; overlay.appendChild(l); setTimeout(()=>l.remove(),1800); } } }
function initOverlap(){ if(!shapes.length) for(let i=0;i<6;i++) shapes.push({x:Math.random()*canvas.clientWidth,y:Math.random()*canvas.clientHeight,r:60+Math.random()*40,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,track:tracks[i%tracks.length],hue:180+i*20}); }
function updateOverlap(){ initOverlap(); const pts=[...pointers.values()]; for(let s of shapes){ s.x+=s.vx; s.y+=s.vy; if(s.x<s.r||s.x>canvas.clientWidth-s.r) s.vx*=-1; if(s.y<s.r||s.y>canvas.clientHeight-s.r) s.vy*=-1; if(pts.length){ let n=pts[0],md=Infinity; for(let pt of pts){ const d=Math.hypot(pt.x-s.x,pt.y-s.y); if(d<md){md=d;n=pt;} } if(md<200){ s.x+=(n.x-s.x)*0.03; s.y+=(n.y-s.y)*0.03; } } } }
function drawOverlap(){ ctx.fillStyle='#0a0a0c'; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight); ctx.globalCompositeOperation='lighter'; for(let s of shapes){ const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r); g.addColorStop(0,`hsla(${s.hue},40%,60%,0.35)`); g.addColorStop(1,`hsla(${s.hue},40%,40%,0)`); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); } ctx.globalCompositeOperation='source-over'; for(let s of shapes){ ctx.fillStyle='rgba(232,230,227,0.6)'; ctx.font='11px system-ui'; ctx.textAlign='center'; ctx.fillText(s.track.title,s.x,s.y); } }
function updateRecall(){ if(lastTouch.active && Math.random()<0.15) recalls.push({x:lastTouch.x,y:lastTouch.y,targetX:lastTouch.x+(Math.random()-0.5)*100,targetY:lastTouch.y+(Math.random()-0.5)*80,progress:0,scale:0.2,track:getRandomTrack(),age:0,variant:Math.floor(Math.random()*3)}); for(let r of recalls){ r.progress=Math.min(1,r.progress+0.02); r.age+=0.016; r.x+=(r.targetX-r.x)*0.05; r.y+=(r.targetY-r.y)*0.05; r.scale=0.3+r.progress*0.9; if(r.age>6) r.progress-=0.01; } recalls=recalls.filter(r=>r.progress>0&&r.age<12); }
function drawRecall(){ ctx.fillStyle='rgba(10,10,12,0.2)'; ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight); for(let r of recalls){ ctx.save(); ctx.translate(r.x,r.y); ctx.scale(r.scale,r.scale); ctx.globalAlpha=Math.min(1,r.progress*1.5)*(1-Math.max(0,r.age-8)*0.3); ctx.strokeStyle='#c8b8a0'; ctx.lineWidth=1.5; if(r.variant===0){ ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.stroke(); } else if(r.variant===1){ ctx.beginPath(); ctx.moveTo(-25,-15); ctx.lineTo(25,0); ctx.lineTo(-25,15); ctx.closePath(); ctx.stroke(); } else { for(let i=0;i<5;i++){ ctx.beginPath(); ctx.arc(0,0,12+i*6,0,Math.PI*2); ctx.stroke(); } } ctx.restore(); if(r.progress>0.6 && Math.random()<0.01){ const l=document.createElement('div'); l.className='track-label'; l.textContent=r.track.artist+' — '+r.track.title; l.style.left=(r.x-60)+'px'; l.style.top=(r.y+40)+'px'; l.style.fontSize='10px'; overlay.appendChild(l); setTimeout(()=>l.remove(),2500); } } }
function loop(){ frame++; if(exp===1){updateResidue();drawResidue();} else if(exp===2){updateOverlap();drawOverlap();} else {updateRecall();drawRecall();} requestAnimationFrame(loop); }
loop();
setInterval(()=>{ const ls=overlay.querySelectorAll('.track-label'); if(ls.length>8) ls[0].remove(); },1000);
</script>
</body>
</html>
